<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="stk-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="stk-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="stk-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded badge background -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#0B132B" stroke="#1E293B" stroke-width="2" />

  <!-- Isometric Interlocking Warehouse 'S' Monogram -->
  <!-- Top Roof Shelf -->
  <polygon points="50,16 80,33 65,41 50,32 35,41 20,33" fill="url(#stk-top)" />
  <!-- Upper Right Column -->
  <polygon points="80,33 80,52 65,60 65,41" fill="#1D4ED8" />
  <!-- Diagonal Dynamic Flow Bridge -->
  <polygon points="65,41 65,60 35,43 35,24" fill="url(#stk-mid)" opacity="0.95" />
  <!-- Lower Left Column -->
  <polygon points="35,43 35,62 20,54 20,35" fill="#047857" />
  <!-- Bottom Floor Shelf -->
  <polygon points="50,84 80,67 65,59 50,68 35,59 20,67" fill="url(#stk-bot)" />
  
  <!-- Glowing Center Telemetry Node -->
  <circle cx="50" cy="50" r="4" fill="#00F0FF" />
</svg>