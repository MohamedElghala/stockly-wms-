<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="stockly-fav-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4FFFC0" />
      <stop offset="100%" stopColor="#00E599" />
    </linearGradient>
    <linearGradient id="stockly-fav-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0A6B52" />
      <stop offset="100%" stopColor="#04382B" />
    </linearGradient>
    <linearGradient id="stockly-fav-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00BF88" />
      <stop offset="100%" stopColor="#06543C" />
    </linearGradient>
    <linearGradient id="fav-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="transparent" />
      <stop offset="50%" stopColor="#00F0FF" />
      <stop offset="100%" stopColor="transparent" />
    </linearGradient>
  </defs>

  <!-- Background Shield Disc -->
  <circle cx="50" cy="50" r="48" fill="#060B14" stroke="#00E599" stroke-width="2.5" />

  <!-- Isometric Warehouse Box -->
  <!-- Top Roof -->
  <polygon points="50,18 80,35 50,52 20,35" fill="url(#stockly-fav-top)" stroke="#03201C" stroke-width="2" stroke-linejoin="round" />
  <!-- Left Wall -->
  <polygon points="20,35 50,52 50,82 20,65" fill="url(#stockly-fav-left)" stroke="#03201C" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Wall -->
  <polygon points="50,52 80,35 80,65 50,82" fill="url(#stockly-fav-right)" stroke="#03201C" stroke-width="2" stroke-linejoin="round" />

  <!-- Barcode Stripes on Right Face -->
  <line x1="58" y1="52" x2="58" y2="74" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95" />
  <line x1="64" y1="48" x2="64" y2="70" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" opacity="0.9" />
  <line x1="70" y1="44" x2="70" y2="66" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.95" />
  <line x1="75" y1="41" x2="75" y2="63" stroke="#00E599" stroke-width="1.4" stroke-linecap="round" opacity="0.85" />

  <!-- Center Vault Lock Pulse -->
  <circle cx="50" cy="52" r="3" fill="#00F0FF" />
</svg>